<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - PVCHAT</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <main class="auth-card">
        <div class="auth-logo">PV<span>CHAT</span></div>

        <h1>Bon retour !</h1>
        <p class="auth-description">
            Connectez-vous pour accéder à vos conversations sécurisées.
        </p>

        <form id="login-form">
            <label for="email">Adresse e-mail</label>
            <input
                type="email"
                id="email"
                placeholder="exemple@email.com"
                required
            >

            <label for="password">Mot de passe</label>
            <input
                type="password"
                id="password"
                placeholder="Votre mot de passe"
                required
            >

            <button type="submit" class="auth-button">
                Se connecter
            </button>
        </form>

        <p class="auth-switch">
            Pas encore de compte ?
            <a href="register.html">Créer un compte</a>
        </p>

        <a href="index.html" class="auth-back">
            ← Retour à l'interface de chat
        </a>
    </main>

    <script>
        document.getElementById("login-form").addEventListener("submit", function(event) {
            event.preventDefault();
            alert("La connexion sera activée lorsque le backend sera intégré.");
        });
    </script>

</body>
</html>
