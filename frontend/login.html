<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - PVCHAT</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <main class="auth-card">
        <div class="auth-logo">PV<span>CHAT</span></div>

        <h1>Bon retour !</h1>
        <p class="auth-description">
            Connectez-vous pour accéder à vos conversations sécurisées.
        </p>

        <div id="formMessage" class="form-message" hidden></div>

        <form id="login-form">
            <label for="username">Nom d'utilisateur</label>
            <input
                type="text"
                id="username"
                placeholder="Votre nom d'utilisateur"
                required
            >

            <label for="password">Mot de passe</label>
            <input
                type="password"
                id="password"
                placeholder="Votre mot de passe"
                required
            >

            <button type="submit" id="submitBtn" class="auth-button">
                Se connecter
            </button>
        </form>

        <p class="auth-switch">
            Pas encore de compte ?
            <a href="register.html">Créer un compte</a>
        </p>
    </main>

<script>
    const formMessage = document.getElementById("formMessage");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(text, isError) {
        formMessage.textContent = text;
        formMessage.className = "form-message " + (isError ? "form-message-error" : "form-message-success");
        formMessage.hidden = false;
    }

    document.getElementById("login-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        submitBtn.disabled = true;
        submitBtn.textContent = "Connexion...";

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('pvchat_token', data.token);
                localStorage.setItem('pvchat_username', data.user.username);
                showMessage("Connexion réussie ! Redirection...", false);
                setTimeout(() => window.location.href = "index.html", 800);
            } else {
                showMessage(data.error || "Identifiants incorrects.", true);
                submitBtn.disabled = false;
                submitBtn.textContent = "Se connecter";
            }
        } catch (err) {
            showMessage("Impossible de contacter le serveur. Vérifiez votre connexion.", true);
            submitBtn.disabled = false;
            submitBtn.textContent = "Se connecter";
        }
    });
</script>

</body>
</html>
