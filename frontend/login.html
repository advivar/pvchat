<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - PVCHAT</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <main class="auth-card">
        <div class="auth-logo">PV<span>CHAT</span></div>

        <h1>Bon retour !</h1>
        <p class="auth-description">
            Connectez-vous pour accéder à vos conversations sécurisées.
        </p>

        <form id="login-form">
            <label for="email">Nom d'utilisateur</label>
            <input
                type="text"
                id="email"
                placeholder="votre_nom_utilisateur"
                required
            >

            <label for="password">Mot de passe</label>
            <input
                type="password"
                id="password"
                placeholder="Votre mot de passe"
                required
            >

            <button type="submit" class="auth-button">
                Se connecter
            </button>
        </form>

        <p class="auth-switch">
            Pas encore de compte ?
            <a href="register.html">Créer un compte</a>
        </p>

        <a href="index.html" class="auth-back">
            ← Retour à l'interface de chat
        </a>
    </main>

<script>
    document.getElementById("login-form").addEventListener("submit", async function(event) {
        event.preventDefault();
        
        // On récupère les valeurs avec les ID exacts du HTML de Mathieu
        const username = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        
        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                // Sauvegarde le Token JWT
                localStorage.setItem('pvchat_token', data.token);
                alert('Connexion réussie !');
                window.location.href = 'index.html';
            } else {
                alert('Erreur : ' + (data.error || 'Identifiants incorrects'));
            }
        } catch (err) {
            console.error('Erreur réseau :', err);
            alert("Impossible de contacter le serveur.");
        }
    });
</script>

</body>
</html>
