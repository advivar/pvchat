<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - PVCHAT</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <main class="auth-card">
        <div class="auth-logo">PV<span>CHAT</span></div>

        <h1>Créer un compte</h1>
        <p class="auth-description">
            Rejoignez PVCHAT pour échanger en toute confidentialité.
        </p>

        <form id="register-form">
            <label for="username">Nom d'utilisateur</label>
            <input
                type="text"
                id="username"
                placeholder="Votre nom d'utilisateur"
                required
            >

            <label for="email">Adresse e-mail</label>
            <input
                type="email"
                id="email"
                placeholder="exemple@email.com"
                required
            >

            <label for="password">Mot de passe</label>
            <input
                type="password"
                id="password"
                placeholder="Choisissez un mot de passe"
                minlength="8"
                required
            >

            <label for="confirm-password">Confirmer le mot de passe</label>
            <input
                type="password"
                id="confirm-password"
                placeholder="Répétez votre mot de passe"
                minlength="8"
                required
            >

            <button type="submit" class="auth-button">
                Créer mon compte
            </button>
        </form>

        <p class="auth-switch">
            Déjà un compte ?
            <a href="login.html">Se connecter</a>
        </p>

        <a href="index.html" class="auth-back">
            ← Retour à l'interface de chat
        </a>
    </main>

    <script>
        document.getElementById("register-form").addEventListener("submit", function(event) {
            event.preventDefault();

            const password = document.getElementById("password").value;
            const confirmation = document.getElementById("confirm-password").value;

            if (password !== confirmation) {
                alert("Les deux mots de passe ne correspondent pas.");
                return;
            }

            alert("L'inscription sera activée lorsque le backend sera intégré.");
        });
    </script>

</body>
</html>
