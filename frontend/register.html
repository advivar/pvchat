<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - PVCHAT</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <main class="auth-card">
        <div class="auth-logo">PV<span>CHAT</span></div>

        <h1>Créer un compte</h1>
        <p class="auth-description">
            Rejoignez PVCHAT pour échanger en toute confidentialité.
        </p>

        <div id="formMessage" class="form-message" hidden></div>

        <form id="register-form">
            <label for="username">Nom d'utilisateur</label>
            <input
                type="text"
                id="username"
                placeholder="Votre nom d'utilisateur"
                required
            >

            <label for="password">Mot de passe</label>
            <input
                type="password"
                id="password"
                placeholder="Choisissez un mot de passe"
                minlength="6"
                required
            >

            <label for="confirm-password">Confirmer le mot de passe</label>
            <input
                type="password"
                id="confirm-password"
                placeholder="Répétez votre mot de passe"
                minlength="6"
                required
            >

            <button type="submit" id="submitBtn" class="auth-button">
                Créer mon compte
            </button>
        </form>

        <p class="auth-switch">
            Déjà un compte ?
            <a href="login.html">Se connecter</a>
        </p>
    </main>

<script>
    const formMessage = document.getElementById("formMessage");
    const submitBtn = document.getElementById("submitBtn");

    function showMessage(text, isError) {
        formMessage.textContent = text;
        formMessage.className = "form-message " + (isError ? "form-message-error" : "form-message-success");
        formMessage.hidden = false;
    }

    document.getElementById("register-form").addEventListener("submit", async function(event) {
        event.preventDefault();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const confirmation = document.getElementById("confirm-password").value;

        if (!username) {
            showMessage("Veuillez entrer un nom d'utilisateur.", true);
            return;
        }

        if (password !== confirmation) {
            showMessage("Les mots de passe ne correspondent pas.", true);
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Création en cours...";

        try {
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                showMessage("Compte créé ! Redirection vers la connexion...", false);
                setTimeout(() => window.location.href = "login.html", 1500);
            } else {
                showMessage(data.error || "Erreur inconnue.", true);
                submitBtn.disabled = false;
                submitBtn.textContent = "Créer mon compte";
            }
        } catch (err) {
            showMessage("Impossible de contacter le serveur. Vérifiez votre connexion.", true);
            submitBtn.disabled = false;
            submitBtn.textContent = "Créer mon compte";
        }
    });
</script>

</body>
</html>
