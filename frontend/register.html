<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - PVCHAT</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <main class="auth-card">
        <div class="auth-logo">PV<span>CHAT</span></div>

        <h1>Créer un compte</h1>
        <p class="auth-description">
            Rejoignez PVCHAT pour échanger en toute confidentialité.
        </p>

        <div id="formMessage" class="form-message" hidden></div>

        <form id="register-form">
            <label for="username">Nom d'utilisateur</label>
            <input
                type="text"
                id="username"
                placeholder="Votre nom d'utilisateur"
                required
            >

            <label for="password">Mot de passe</label>
            <input
                type="password"
                id="password"
                placeholder="Choisissez un mot de passe"
                minlength="6"
                required
            >

            <label for="confirm-password">Confirmer le mot de passe</label>
            <input
                type="password"
                id="confirm-password"
                placeholder="Répétez votre mot de passe"
                minlength="6"
                required
            >

            <button type="submit" id="submitBtn" class="auth-button">
                Créer mon compte
            </button>
        </form>

        <p class="auth-switch">
            Déjà un compte ?
            <a href="login.html">Se connecter</a>
        </p>
    </main>

<script type="module">
    import { initRegisterForm } from './scripts/auth-forms.js';
    initRegisterForm();
</script>

</body>
</html>
