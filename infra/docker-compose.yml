name: pvchat-stack

services:
  postgres:
    image: postgres:18-alpine
    container_name: pvchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - db-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: pvchat-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_started
    networks:
      - db-net
      - web-net

  reverse-proxy:
    image: nginx:alpine
    container_name: pvchat-nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - web-net

volumes:
  pgdata:
    name: pvchat_pgdata

networks:
  db-net:
    internal: true
  web-net:
    driver: bridge
